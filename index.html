<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8ed9ef">
  <title>Собери картину</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #193458;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.8) 0 4px, transparent 5px),
        radial-gradient(circle at 85% 75%, rgba(255,255,255,.65) 0 5px, transparent 6px),
        linear-gradient(145deg, #bdeeff, #fdf1ad);
      background-size: 48px 48px, 62px 62px, auto;
    }
    main {
      width: min(760px, 100%);
      padding: clamp(25px, 6vw, 55px);
      border: 5px solid white;
      border-radius: 32px;
      background: rgba(255,255,255,.86);
      box-shadow: 0 12px 0 rgba(45,125,165,.25);
      text-align: center;
    }
    .puzzle { font-size: clamp(3.5rem, 10vw, 6rem); }
    h1 { margin: 5px 0 12px; color: #153b76; font-size: clamp(2.3rem, 7vw, 4.5rem); line-height: .95; }
    p { margin: 0 auto 28px; color: #39739a; font-size: 1.15rem; font-weight: bold; }
    .games { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    a {
      min-height: 155px;
      display: grid;
      place-items: center;
      padding: 22px;
      border-radius: 22px;
      color: white;
      background: #2463db;
      box-shadow: 0 7px 0 #1743a0;
      text-decoration: none;
      font-size: 1.35rem;
      font-weight: bold;
      transition: transform .15s, filter .15s;
    }
    a:last-child { background: #e45d62; box-shadow: 0 7px 0 #ad3741; }
    a:hover, a:focus-visible { transform: translateY(-4px); filter: brightness(1.08); outline: 4px solid #ffd447; }
    a span { display: block; margin-bottom: 8px; font-size: 3rem; }
    @media (max-width: 560px) { .games { grid-template-columns: 1fr; } a { min-height: 120px; } }
  </style>
</head>
<body>
  <main>
    <div class="puzzle" aria-hidden="true">🧩</div>
    <h1>Собери картину!</h1>
    <p>Выберите режим игры</p>
    <div class="games">
      <a href="Собери_картину.html"><span aria-hidden="true">🎨</span>Один игрок</a>
      <a href="Собери_картину_для_двоих.html"><span aria-hidden="true">👫</span>Два игрока</a>
    </div>
  </main>
</body>
</html>
